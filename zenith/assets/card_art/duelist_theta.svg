<svg xmlns="http://www.w3.org/2000/svg" width="604" height="868" viewBox="0 0 604 868">
  <!-- Placeholder crest: the Amalgam. A gear whose two halves were never made for each other,
       riveted across the seam, over the stamped name still under Marrow's jaw. -->
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#232a33"/>
      <stop offset="1" stop-color="#07090c"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6dbe0"/>
      <stop offset="1" stop-color="#7d868f"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a862"/>
      <stop offset="1" stop-color="#8a5322"/>
    </linearGradient>
  </defs>
  <rect width="604" height="868" fill="url(#field)"/>
  <path d="M0,730 C140,706 240,748 340,732 C440,716 520,748 604,728" fill="none" stroke="#c98a42" stroke-opacity="0.18" stroke-width="4"/>
  <g transform="translate(-466.4,-12.8) scale(1.7)">
    <path d="M312,84 H592 V250 C592,332 522,382 452,406 C382,382 312,332 312,250 Z" fill="#11151a" stroke="#b6c2cc" stroke-opacity="0.5" stroke-width="5"/>
    <!-- left half cut stone, right half worn copper: the same gear, two makers -->
    <g transform="translate(452,236)">
      <path d="M-110,-18 h24 l6,-26 l26,-10 l18,20 l26,-6 V-18 H0 V18 H-10 l-4,28 l-26,10 l-18,-20 l-26,6 V18 h-26 Z" fill="url(#stone)" stroke="#0b0e12" stroke-width="3"/>
      <path d="M110,-18 h-24 l-6,-26 l-26,-10 l-18,20 l-26,-6 V-18 H0 V18 h10 l4,28 l26,10 l18,-20 l26,6 V18 h26 Z" fill="url(#copper)" stroke="#0b0e12" stroke-width="3"/>
      <circle cx="0" cy="0" r="40" fill="#11151a" stroke="#b6c2cc" stroke-width="5"/>
      <circle cx="0" cy="0" r="16" fill="#c98a42"/>
      <path d="M0,-118 V118" stroke="#0b0e12" stroke-width="5"/>
      <g fill="#dfe6ec">
        <circle cx="0" cy="-104" r="6"/><circle cx="0" cy="-64" r="6"/>
        <circle cx="0" cy="64" r="6"/><circle cx="0" cy="104" r="6"/>
      </g>
    </g>
    <!-- the old owner's name, still stamped and past reading -->
    <rect x="392" y="330" width="120" height="26" rx="4" fill="#2a3138" stroke="#b6c2cc" stroke-opacity="0.6" stroke-width="3"/>
    <g fill="#b6c2cc" fill-opacity="0.45">
      <rect x="404" y="339" width="22" height="8"/><rect x="434" y="339" width="14" height="8"/>
      <rect x="456" y="339" width="26" height="8"/><rect x="490" y="339" width="10" height="8"/>
    </g>
  </g>
</svg>
