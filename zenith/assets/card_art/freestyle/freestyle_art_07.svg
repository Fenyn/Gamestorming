      <stop offset="0" stop-color="#d9f2ff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <rect y="548" width="904" height="92" fill="#121016"/>
  <!-- the halo, coming apart -->
