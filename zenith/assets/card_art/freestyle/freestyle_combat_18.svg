    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f5f7"/><stop offset="1" stop-color="#7d848a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c2a2"/><stop offset="1" stop-color="#8d7455"/>
    </linearGradient>
  </defs>
  <rect width="904" height="600" fill="url(#bg)"/>
  <rect y="488" width="904" height="112" fill="#161310"/>
  <!-- both blades, points to the floor -->
  <g transform="translate(180,150) rotate(-9)">
    <rect x="-20" y="0" width="40" height="330" fill="url(#blade)"/>
    <path d="M-20,330 L20,330 L0,378 Z" fill="url(#blade)"/>
