<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="blade1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="blade2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="16" fill="url(#bg)" stroke="#2a2a4a" stroke-width="2"/>
  <!-- Crossed swords -->
  <!-- Sword 1: top-left to bottom-right -->
  <line x1="30" y1="28" x2="98" y2="96" stroke="url(#blade1)" stroke-width="4" stroke-linecap="round"/>
  <!-- Sword 1 guard -->
  <line x1="40" y1="48" x2="56" y2="32" stroke="#c0a040" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 1 pommel -->
  <circle cx="30" cy="28" r="3" fill="#c0a040"/>
  <!-- Sword 2: top-right to bottom-left -->
  <line x1="98" y1="28" x2="30" y2="96" stroke="url(#blade2)" stroke-width="4" stroke-linecap="round"/>
  <!-- Sword 2 guard -->
  <line x1="88" y1="48" x2="72" y2="32" stroke="#c0a040" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 2 pommel -->
  <circle cx="98" cy="28" r="3" fill="#c0a040"/>
  <!-- Inverted triangle stance indicator (center) -->
  <polygon points="64,42 46,72 82,72" fill="none" stroke="#30b0ff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top stance dot (active) -->
  <circle cx="64" cy="42" r="4" fill="#30b0ff"/>
  <!-- Bottom-left stance dot -->
  <circle cx="46" cy="72" r="3" fill="#30b0ff" opacity="0.4"/>
  <!-- Bottom-right stance dot -->
  <circle cx="82" cy="72" r="3" fill="#30b0ff" opacity="0.4"/>
  <!-- Posture bar glow at bottom -->
  <rect x="28" y="100" width="72" height="5" rx="2.5" fill="#1a1a2e" stroke="#444" stroke-width="0.5"/>
  <rect x="28" y="100" width="45" height="5" rx="2.5" fill="#e08020" opacity="0.8"/>
</svg>
