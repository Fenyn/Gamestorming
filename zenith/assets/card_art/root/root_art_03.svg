  <g fill="url(#wood)" stroke="#2c1f12" stroke-width="6">
    <path d="M356,290 h96 l22,190 h-140 Z" transform="rotate(-14 410 386)"/>
    <path d="M472,300 h92 l16,180 h-132 Z" transform="rotate(16 518 390)"/>
