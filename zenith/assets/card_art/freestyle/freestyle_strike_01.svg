<svg xmlns="http://www.w3.org/2000/svg" width="904" height="640" viewBox="0 0 904 640">
  <!-- Placeholder art: Old Habit. Thrown backhand without turning round, and the page comes back
       into the other hand on its own. -->
  <rect width="904" height="640" fill="#696969"/>
  <!-- him, facing away from what he just hit -->
  <g fill="none" stroke="#fffafa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="380" cy="186" r="46"/>
    <path d="M380,232 C392,296 390,346 384,392"/>
    <path d="M384,392 C346,446 324,498 318,556"/>
    <path d="M384,392 C438,430 472,484 484,552"/>
    <path d="M304,562 L350,570"/>
    <path d="M472,558 L520,566"/>
    <!-- the backhand, out behind him -->
    <path d="M386,262 C452,254 514,252 566,258"/>
    <!-- and the other hand, open, waiting -->
    <path d="M374,276 C336,300 306,324 288,346"/>
    <path d="M288,346 C266,340 250,346 244,362"/>
  </g>
  <g fill="none" stroke="#dcdcdc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
