<svg xmlns="http://www.w3.org/2000/svg" width="904" height="640" viewBox="0 0 904 640">
  <!-- Placeholder art: Root Uprooting Blast. The stump comes out of the ground and goes outward
       in pieces, roots and all. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="76%">
      <stop offset="0" stop-color="#3b3d1c"/><stop offset="1" stop-color="#080905"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39a5e"/><stop offset="1" stop-color="#6b4f32"/>
    </linearGradient>
    <radialGradient id="flash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c8"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <rect y="470" width="904" height="170" fill="#1e2413"/>
  <circle cx="452" cy="400" r="300" fill="url(#flash)" fill-opacity="0.55"/>
  <!-- the hole it came out of -->
  <ellipse cx="452" cy="486" rx="200" ry="56" fill="#100d07"/>
