    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2a1a"/><stop offset="0.5" stop-color="#a97f45"/>
      <stop offset="1" stop-color="#e6cf9a"/>
    </linearGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <!-- the gate behind, and the seals answering -->
  <rect x="120" y="30" width="664" height="580" fill="url(#marble)"/>
  <g>
