    <g transform="translate(340,258) rotate(-12)">
      <rect x="-90" y="-150" width="44" height="152" rx="22"/>
      <rect x="-40" y="-172" width="44" height="174" rx="22"/>
      <rect x="10" y="-166" width="44" height="168" rx="22"/>
      <rect x="60" y="-140" width="44" height="142" rx="22"/>
      <path d="M-96,-16 h206 v70 a56,56 0 0 1 -56,56 h-94 a56,56 0 0 1 -56,-56 Z"/>
      <g transform="translate(-96,42) rotate(26)"><rect x="-40" y="-28" width="130" height="56" rx="28"/></g>
    </g>
    <g transform="translate(612,412) rotate(168)">
      <rect x="-90" y="-136" width="42" height="140" rx="21"/>
      <rect x="-42" y="-156" width="42" height="160" rx="21"/>
      <rect x="6" y="-150" width="42" height="154" rx="21"/>
      <rect x="54" y="-128" width="42" height="132" rx="21"/>
