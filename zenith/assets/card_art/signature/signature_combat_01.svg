<svg xmlns="http://www.w3.org/2000/svg" width="904" height="600" viewBox="0 0 904 600">
  <!-- Placeholder art: Edric's Truce. The point stops a hand's width short and the two of them
       look at each other over it. Edric's card, so no school fire in it at all. -->
  <rect width="904" height="600" fill="#696969"/>
  <!-- Edric, the one who stopped -->
  <g fill="none" stroke="#fffafa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="176" cy="196" r="46"/>
    <path d="M176,242 C186,306 184,356 178,406"/>
    <path d="M178,406 C144,458 124,506 120,558"/>
    <path d="M178,406 C222,442 248,494 258,556"/>
    <path d="M108,562 L152,570"/>
    <path d="M246,560 L292,568"/>
    <path d="M180,270 C238,272 292,278 338,290"/>
    <path d="M172,282 C142,312 124,342 118,370"/>
  </g>
  <!-- the blade, level and going no further -->
  <g fill="none" stroke="#dcdcdc" stroke-width="9" stroke-linecap="round">
    <path d="M362,284 C452,280 540,280 620,286"/>
    <path d="M362,306 C452,302 540,302 618,308"/>
  </g>
  <g fill="none" stroke="#8b4513" stroke-width="8" stroke-linecap="round">
    <path d="M348,262 L348,330"/>
    <path d="M320,294 L346,296"/>
  </g>
  <!-- the gap he left -->
  <g fill="none" stroke="#ffd700" stroke-width="5" stroke-linecap="round">
    <path d="M622,252 L680,252"/>
    <path d="M622,244 L622,262"/>
    <path d="M680,244 L680,262"/>
  </g>
  <!-- the other one, standing still for it -->
  <g fill="none" stroke="#fffafa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="744" cy="192" r="46"/>
    <path d="M744,238 C752,302 750,352 744,402"/>
    <path d="M744,402 C716,454 702,504 700,556"/>
    <path d="M744,402 C782,444 804,500 810,556"/>
    <path d="M688,562 L732,570"/>
    <path d="M798,558 L844,566"/>
    <path d="M740,266 C706,290 682,318 668,348"/>
    <path d="M748,268 C784,292 810,318 824,346"/>
  </g>
  <!-- the look between them -->
  <g fill="none" stroke="#fffafa" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="20 18" stroke-linecap="round">
    <path d="M222,188 C400,178 570,178 700,186"/>
