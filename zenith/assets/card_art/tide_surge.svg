    <path d="M768,344 C760,398 750,438 738,470"/>
    <path d="M738,470 C752,520 768,562 788,598"/>
    <path d="M738,470 C716,512 702,554 698,598"/>
    <path d="M756,376 C726,396 704,416 690,436"/>
    <path d="M780,374 C812,394 838,414 854,434"/>
  </g>
  <g fill="none" stroke="#87ceeb" stroke-width="8" stroke-linecap="round">
    <path d="M690,344 L650,320"/>
    <path d="M700,404 L662,424"/>
    <path d="M626,214 L590,236"/>
  </g>
</svg>
