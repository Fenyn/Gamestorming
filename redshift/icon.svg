<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0ff"/>
      <stop offset="100%" stop-color="#8888cc"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6644" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffaa44" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="15" cy="20" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="105" cy="15" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="45" cy="95" r="0.8" fill="#ffffff" opacity="0.4"/>
  <circle cx="90" cy="80" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="25" cy="60" r="0.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="110" cy="55" r="0.8" fill="#ffffff" opacity="0.4"/>
  <!-- engine trail -->
  <path d="M 20,68 Q 50,58 75,64" stroke="url(#trail)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 25,72 Q 52,65 75,68" stroke="url(#trail)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- ship body -->
  <polygon points="110,64 75,52 75,76" fill="url(#ship)"/>
  <polygon points="75,52 68,44 68,56" fill="#6666aa"/>
  <polygon points="75,76 68,84 68,72" fill="#6666aa"/>
  <!-- cockpit -->
  <ellipse cx="98" cy="64" rx="6" ry="4" fill="#44aaff" opacity="0.7"/>
  <!-- engine glow -->
  <circle cx="75" cy="64" r="5" fill="#ffaa44" opacity="0.6"/>
  <circle cx="75" cy="64" r="3" fill="#ffdd88" opacity="0.8"/>
</svg>
