<svg xmlns="http://www.w3.org/2000/svg" width="904" height="640" viewBox="0 0 904 640">
  <!-- Placeholder art: Corin Throws Smoke. The bolt lands in the smoke and after that neither of
       them knows where the other one is. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a2a2c"/><stop offset="1" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3c8"/><stop offset="1" stop-color="#e09a3a"/>
    </linearGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <rect y="540" width="904" height="100" fill="#141416"/>
  <!-- the two of them, each already half gone -->
  <g fill="#0e0f11" fill-opacity="0.95">
    <circle cx="150" cy="248" r="52"/>
    <path d="M86,304 h128 l30,236 h-188 Z"/>
  </g>
  <g fill="#0e0f11" fill-opacity="0.8">
    <circle cx="754" cy="248" r="52"/>
    <path d="M690,304 h128 l30,236 h-188 Z"/>
  </g>
  <!-- the bolt, going in and not coming out the other side -->
  <path d="M0,168 L180,214 L120,240 L300,290" fill="none" stroke="url(#bolt)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the smoke -->
  <g fill="#6f7276" fill-opacity="0.5">
    <circle cx="360" cy="330" r="150"/>
    <circle cx="500" cy="286" r="130"/>
    <circle cx="560" cy="396" r="140"/>
    <circle cx="416" cy="452" r="126"/>
    <circle cx="628" cy="300" r="96"/>
    <circle cx="288" cy="428" r="100"/>
  </g>
  <g fill="#9a9da2" fill-opacity="0.4">
    <circle cx="420" cy="300" r="94"/>
    <circle cx="540" cy="370" r="84"/>
    <circle cx="350" cy="410" r="78"/>
  </g>
  <g fill="#c9ccd0" fill-opacity="0.3">
    <circle cx="452" cy="340" r="66"/>
  </g>
  <ellipse cx="452" cy="330" rx="120" ry="90" fill="#ffd9a0" fill-opacity="0.12"/>
</svg>
