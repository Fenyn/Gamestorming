    <path d="M548,376 l86,26 l-46,98 l-86,-28 Z" transform="rotate(22 570 438)"/>
  </g>
  <!-- roots, torn and still moving -->
  <g fill="none" stroke="#6b4f32" stroke-width="16" stroke-linecap="round">
    <path d="M330,470 C262,486 206,532 172,592"/>
    <path d="M574,470 C642,486 698,532 732,592"/>
    <path d="M406,486 C376,540 370,574 380,606"/>
    <path d="M506,486 C536,540 542,574 532,606"/>
  </g>
  <!-- splinters -->
  <g fill="#e6cf9a">
    <path d="M198,238 l52,-22 l8,46 Z"/>
    <path d="M700,268 l54,16 l-24,42 Z"/>
    <path d="M284,140 l44,-30 l16,44 Z"/>
    <path d="M626,142 l46,26 l-34,34 Z"/>
    <path d="M452,96 l30,-46 l24,48 Z"/>
    <path d="M120,392 l48,-6 l-16,44 Z"/>
