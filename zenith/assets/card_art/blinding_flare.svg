<svg xmlns="http://www.w3.org/2000/svg" width="904" height="640" viewBox="0 0 904 640">
  <!-- Placeholder art: Blinding Flare. Thrown into the face, and the hands come up after it has
       already gone off. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2b2a24"/><stop offset="1" stop-color="#080807"/>
    </radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#fff3c8"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7b193"/><stop offset="1" stop-color="#6f5b41"/>
    </linearGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <!-- the one it went off in front of -->
  <g fill="#14110c">
    <circle cx="452" cy="270" r="96"/>
    <path d="M330,380 h244 l40,260 h-324 Z"/>
  </g>
  <!-- the hands, coming up late -->
  <g fill="url(#skin)" stroke="#231c12" stroke-width="6">
    <g transform="translate(268,452) rotate(-30)">
      <rect x="-70" y="-140" width="44" height="146" rx="22"/>
      <rect x="-22" y="-156" width="44" height="162" rx="22"/>
      <rect x="26" y="-148" width="44" height="154" rx="22"/>
      <path d="M-74,-8 h150 v58 a50,50 0 0 1 -50,50 h-50 a50,50 0 0 1 -50,-50 Z"/>
    </g>
    <g transform="translate(640,462) rotate(30)">
      <rect x="-70" y="-140" width="44" height="146" rx="22"/>
      <rect x="-22" y="-156" width="44" height="162" rx="22"/>
      <rect x="26" y="-148" width="44" height="154" rx="22"/>
      <path d="M-74,-8 h150 v58 a50,50 0 0 1 -50,50 h-50 a50,50 0 0 1 -50,-50 Z"/>
    </g>
  </g>
  <!-- the flare itself -->
  <circle cx="452" cy="256" r="300" fill="url(#flare)"/>
  <circle cx="452" cy="256" r="86" fill="#ffffff"/>
  <g stroke="#fff3c8" stroke-width="14" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M452,40 V128 M452,384 V472 M236,256 H324 M580,256 H668"/>
    <path d="M300,104 L360,164 M604,104 L544,164 M300,408 L360,348 M604,408 L544,348"/>
  </g>
</svg>
