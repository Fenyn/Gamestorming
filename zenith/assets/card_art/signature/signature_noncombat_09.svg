      <stop offset="0" stop-color="#241a26"/><stop offset="1" stop-color="#0a0710"/>
    </radialGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6c1b4"/><stop offset="1" stop-color="#85806f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e9ec"/><stop offset="1" stop-color="#8b9197"/>
    </linearGradient>
  </defs>
  <rect width="904" height="480" fill="url(#bg)"/>
  <rect x="152" y="36" width="600" height="408" fill="url(#marble)"/>
  <g stroke="#7e7a70" stroke-opacity="0.45" fill="none" stroke-width="3">
    <path d="M152,124 C300,102 430,146 600,116 C680,102 720,118 752,108"/>
  </g>
