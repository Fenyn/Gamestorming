<svg xmlns="http://www.w3.org/2000/svg" width="904" height="480" viewBox="0 0 904 480">
  <!-- Placeholder art: Sleight. A seal palmed flat under a glove, its light showing only in the
       gaps between the fingers. Nobody saw it go. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#241f2c"/><stop offset="1" stop-color="#07060b"/>
    </radialGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#342c3c"/><stop offset="1" stop-color="#15111c"/>
    </linearGradient>
  </defs>
  <rect width="904" height="480" fill="url(#bg)"/>
  <ellipse cx="452" cy="250" rx="250" ry="160" fill="#ffc47a" fill-opacity="0.14"/>
  <!-- the seal, flat on the stone and mostly covered -->
  <rect x="330" y="140" width="244" height="244" rx="12" fill="#cfcabd"/>
  <rect x="362" y="172" width="180" height="180" rx="8" fill="#2b2620"/>
  <rect x="392" y="202" width="120" height="120" rx="6" fill="none" stroke="#ffd9a0" stroke-width="10"/>
  <!-- the glove over it: fingers up, gaps letting the light through -->
  <g fill="url(#glove)" stroke="#4a3f58" stroke-width="4">
    <rect x="352" y="108" width="40" height="150" rx="20"/>
    <rect x="404" y="86" width="40" height="172" rx="20"/>
    <rect x="456" y="92" width="40" height="166" rx="20"/>
    <rect x="508" y="116" width="40" height="142" rx="20"/>
    <path d="M344,236 h216 v82 a56,56 0 0 1 -56,56 h-104 a56,56 0 0 1 -56,-56 Z"/>
    <g transform="translate(340,286) rotate(28)">
      <rect x="-34" y="-26" width="120" height="52" rx="26"/>
    </g>
    <path d="M382,362 h140 l18,86 h-176 Z"/>
  </g>
  <!-- what leaks out anyway -->
  <g stroke="#ffd9a0" stroke-opacity="0.8" stroke-width="7" stroke-linecap="round">
    <path d="M398,120 l-10,-44 M450,96 l-4,-46 M502,102 l8,-44 M556,150 l38,-26"/>
  </g>
</svg>
