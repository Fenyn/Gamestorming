    <linearGradient id="held" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa3aa"/>
    </linearGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <rect y="540" width="904" height="100" fill="#111418"/>
  <!-- the guard: one blade upright, both hands on it -->
  <g transform="translate(452,300)">
