<svg xmlns="http://www.w3.org/2000/svg" width="604" height="868" viewBox="0 0 604 868">
  <!-- Emrys Rooke, First Plate. One arm straight up, plate closed over the forearm like a bracer
       he grew, and him down in the corner of the frame watching the hand open and shut. -->
  <rect width="604" height="868" fill="#696969"/>
  <!-- the arm, upright, dominating the frame -->
  <g fill="none" stroke="#fffafa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300,700 C298,580 302,460 312,352"/>
    <path d="M396,694 C398,576 394,458 384,350"/>
  </g>
  <!-- the plate on it -->
  <g fill="none" stroke="#dcdcdc" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300,636 C300,532 304,438 312,360"/>
    <path d="M396,632 C396,530 392,436 384,358"/>
    <path d="M300,636 C330,650 368,648 396,632"/>
    <path d="M312,360 C334,346 364,346 384,358"/>
  </g>
  <g fill="none" stroke="#4682b4" stroke-width="7" stroke-linecap="round">
    <path d="M304,566 C330,578 366,576 392,564"/>
    <path d="M306,482 C332,494 366,492 390,480"/>
    <path d="M310,404 C334,416 364,414 386,402"/>
  </g>
  <!-- the hand at the top, half open -->
  <g fill="none" stroke="#fffafa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312,352 C304,300 306,258 318,228"/>
    <path d="M348,346 C342,288 344,240 356,208"/>
    <path d="M384,350 C382,296 388,254 402,226"/>
    <path d="M396,368 C414,332 428,306 444,290"/>
    <path d="M312,352 C288,344 274,320 284,300"/>
  </g>
  <!-- him, small, low left, looking up at it -->
  <g fill="none" stroke="#fffafa" stroke-width="5" stroke-opacity="0.95" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,640 C78,606 108,588 140,594 C172,600 186,630 182,672 C178,716 156,738 128,736 C96,734 78,704 78,672 Z"/>
    <path d="M74,646 C84,616 118,590 152,600 C170,606 180,618 184,632"/>
    <path d="M94,662 C104,656 118,658 126,666"/>
    <path d="M144,670 C154,664 168,666 176,674"/>
    <path d="M136,674 C134,692 130,702 124,710"/>
    <path d="M106,724 C118,728 136,726 148,720"/>
    <path d="M104,742 C106,762 104,774 100,784"/>
    <path d="M160,734 C162,756 164,768 168,778"/>
    <path d="M32,832 C62,802 176,796 216,826"/>
    <path d="M32,832 C22,846 16,856 14,866"/>
    <path d="M216,826 C226,840 232,854 234,866"/>
    <!-- the other arm reaching up toward the plate -->
    <path d="M216,830 C244,802 268,770 284,734"/>
  </g>
  <g fill="none" stroke="#4682b4" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round">
    <path d="M462,398 L502,376"/>
    <path d="M468,514 L510,514"/>
    <path d="M460,620 L500,640"/>
  </g>
</svg>
