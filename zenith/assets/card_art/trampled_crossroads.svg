  </g>
  <g fill="none" stroke="#ffd700" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round">
    <path d="M120,318 C300,296 500,300 668,282"/>
  </g>
  <!-- a bare post at the meeting, nothing on it -->
  <g fill="none" stroke="#fffafa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M462,104 C458,178 458,258 462,330"/>
    <path d="M440,336 C462,346 486,344 502,332"/>
