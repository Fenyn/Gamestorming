<svg xmlns="http://www.w3.org/2000/svg" width="904" height="640" viewBox="0 0 904 640">
  <!-- Placeholder art: Mourne's Stance. Feet planted wide, one blade already stopped and the
       next one stopping behind it. He has not given a step. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a1e33"/><stop offset="1" stop-color="#08050e"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f5f7"/><stop offset="1" stop-color="#7d848a"/>
    </linearGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <rect y="520" width="904" height="120" fill="#150f1c"/>
  <path d="M0,520 H904" stroke="#3a2b48" stroke-width="6"/>
  <!-- the stance: planted wide, weight down -->
  <g fill="#0d0912">
    <path d="M380,180 h144 l40,268 h-224 Z"/>
    <circle cx="452" cy="132" r="50"/>
    <path d="M340,448 h110 l-70,86 h-118 Z"/>
    <path d="M454,448 h110 l128,86 h-118 Z"/>
    <path d="M250,520 h150 v30 h-150 Z"/>
    <path d="M574,520 h150 v30 h-150 Z"/>
  </g>
  <!-- the forearm the blades are coming onto -->
  <g fill="#2b2035" stroke="#0d0912" stroke-width="6">
    <g transform="translate(300,266) rotate(-28)">
      <rect x="-150" y="-40" width="300" height="80" rx="40"/>
    </g>
  </g>
  <!-- the blade that stopped -->
  <g transform="translate(206,150) rotate(62)">
    <rect x="-18" y="0" width="36" height="230" fill="url(#blade)"/>
    <path d="M-18,230 L18,230 L0,272 Z" fill="url(#blade)"/>
    <rect x="-58" y="-20" width="116" height="24" rx="11" fill="#8b6a3f"/>
  </g>
  <!-- and the one behind it, stopping now -->
  <g transform="translate(150,268) rotate(48)" opacity="0.92">
    <rect x="-16" y="0" width="32" height="210" fill="url(#blade)"/>
    <path d="M-16,210 L16,210 L0,248 Z" fill="url(#blade)"/>
    <rect x="-52" y="-18" width="104" height="22" rx="10" fill="#8b6a3f"/>
  </g>
  <g stroke="#e0b0ff" stroke-width="9" stroke-linecap="round">
    <path d="M336,272 l-52,-36 M356,314 l-58,4 M330,230 l-30,-52"/>
  </g>
</svg>
