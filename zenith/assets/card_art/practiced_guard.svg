<svg xmlns="http://www.w3.org/2000/svg" width="904" height="640" viewBox="0 0 904 640">
  <!-- Placeholder art: Corin's Practiced Guard. No weapon in it. Open hands in a form he has made
       ten thousand times, and the brace coming up out of the floor to meet them. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a2620"/><stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c2a2"/><stop offset="1" stop-color="#8d7455"/>
    </linearGradient>
    <linearGradient id="brace" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd9a0"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="904" height="640" fill="url(#bg)"/>
  <rect y="520" width="904" height="120" fill="#141210"/>
  <path d="M0,520 H904" stroke="#3a3228" stroke-width="6"/>
  <!-- the brace, lifting out of the stone -->
  <g>
    <path d="M196,520 h512 l-60,-330 h-392 Z" fill="url(#brace)" fill-opacity="0.35"/>
    <g fill="none" stroke="#ffd9a0" stroke-opacity="0.6" stroke-width="7">
