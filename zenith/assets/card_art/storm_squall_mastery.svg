<svg xmlns="http://www.w3.org/2000/svg" width="904" height="400" viewBox="0 0 904 400">
  <!-- Placeholder art: Storm Squall Mastery. The line comes in over flat ground with the rain
       already down in a wall under it. School emblem: no figure. -->
