  </g>
  <g fill="none" stroke="#fffafa" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="20 16" stroke-linecap="round">
    <path d="M200,290 C204,320 218,344 240,360"/>
  </g>
</svg>
