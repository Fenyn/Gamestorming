  <rect width="604" height="868" fill="url(#field)"/>
  <path d="M0,724 C140,700 240,742 340,726 C440,710 520,742 604,722" fill="none" stroke="#4fb8c8" stroke-opacity="0.22" stroke-width="4"/>
  <path d="M0,776 C150,754 250,792 350,776 C450,760 530,790 604,772" fill="none" stroke="#4fb8c8" stroke-opacity="0.12" stroke-width="4"/>
  <g transform="translate(-466.4,-12.8) scale(1.7)">
