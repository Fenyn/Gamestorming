      <stop offset="0" stop-color="#3d3021"/><stop offset="1" stop-color="#130e08"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee5cf"/><stop offset="1" stop-color="#b8ad8e"/>
    </linearGradient>
  </defs>
  <rect width="904" height="400" fill="url(#bg)"/>
  <path d="M0,168 C160,148 300,178 452,164 C610,150 740,180 904,158 V400 H0 Z" fill="url(#soil)"/>
  <!-- the page, half under -->
